name: vc-harvest

# Phase 1: metadata for every reachable sold listing, one brand per run.
# The concurrency group means ten dispatched runs QUEUE rather than run at once
# — same total time, but only one client is ever talking to their search API.
on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Vestiaire brand id'
        required: true
      from:
        description: 'Start month YYYY-MM'
        default: '2023-01'
      sold:
        description: '1 = sold listings, 0 = live listings'
        default: '1'

concurrency:
  group: vestiaire-api
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet -r requirements.txt
      - env:
          VC_BRAND: ${{ inputs.brand }}
          VC_FROM:  ${{ inputs.from }}
          VC_SOLD:  ${{ inputs.sold }}
        run: python scripts/vc_harvest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harvest-${{ inputs.sold == '1' && 'sold' || 'live' }}-${{ inputs.brand }}
          path: vc_*_*.jsonl
          retention-days: 30
