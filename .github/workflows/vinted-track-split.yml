name: vinted-track-split

# One job could do a full sweep OR a full check pass, not both.
#
# Cycle 14 proved it: sweeping every band saw all 21,716 listings (0 unswept)
# but then hit 403s and completed only 436 of 1,963 absent checks. Discovery
# and checking were competing for one job's allowance, and discovery won
# because it runs first.
#
# So the work is split by KIND, not duplicated:
#
#   discover  two shards, every band          ~180 requests each
#   plan      build the check queue           no requests
#   check     five shards over the queue      ~520 requests each
#   rescue    retries what they missed        up to 1,000 requests
#   apply     fold verdicts into state        no requests
#
# Each request-making job is sized to fill its own allowance without crossing
# it (VT_MAX_REQ), rather than leaving capacity unused. plan and apply are the
# only writers of state and never run concurrently, so shards cannot conflict.
#
# The ceiling is not a fixed count, and may not be about our load at all. In
# one cycle a check shard ran 1,000 requests clean while its SIBLING was
# refused after 101 - same code, same minutes, different runner. GitHub's
# runner pool is shared, so some addresses arrive already in poor standing
# with Vinted through nothing we did.
#
# Measured block rate is ~25% of request-making jobs, so the answer is
# redundancy, not a bigger per-job budget: six small jobs lose less to one bad
# draw than two large ones. A blocked shard gives up cheaply after 8 refusals
# and its slice simply leads the queue next cycle.
#
# This mitigates the problem; it cannot remove it. Which address a runner gets
# is not ours to choose, so some coverage is lost on any cycle where several
# shards draw badly. VT_MAX_REQ is a guard rail; the backoff and give-up are
# the real protection.

on:
  # Target: a sweep interval T of about one hour, because T is what sets the
  # fastest sale we can see at all. P(catch) = min(1, L/T) for a listing that
  # lives L hours, so at T=5.9h anything under ~6h was luck - and the fastest
  # sale in 204 dated records is 4.1h, which is the instrument's blind spot
  # rather than a fact about the market.
  #
  # Asking for 30 minutes to land near 60. GitHub's scheduler runs roughly 2x
  # late under load - a 3-hour cron was delivering 5.9h - and the concurrency
  # group serialises anything that arrives while a cycle is still running, so
  # over-requesting costs nothing and absorbs skipped firings.
  #
  # This is affordable because a SHORTER cycle has LESS work, not more: the
  # absent queue scales with T, so ~387 listings per hour instead of ~2,281
  # per 6 hours. Whole cycle is ~24 min and per-job volume ~200 requests.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency: { group: vinted-track, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  # Discovery is sharded too, because a block costs COVERAGE here, not just
  # time: one blocked run returned 7,057 of 21,719 listings and seven brands
  # went unswept. Two shards halve the worst case, and each draws its own IP,
  # so a bad address takes out five brands instead of ten.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1] }
    env:
      VT_BANDS_PER_CYCLE: '0'      # every band
      VT_MAX_REQ: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - run: >
          python scripts/vinted_track.py --mode discover
          --shard ${{ matrix.shard }} --shards 2
          --out found-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: found-${{ matrix.shard }}
          path: found-${{ matrix.shard }}.json

  plan:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ref: main matters. Checkout defaults to the SHA that TRIGGERED the run,
      # so by the time these later jobs start they would be reading a state
      # file from before the earlier jobs committed - which is how the
      # per-cycle seen/absent counts came out None.
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - uses: actions/download-artifact@v4
        with: { path: found, pattern: 'found-*', merge-multiple: true }
        # The queue is absence-driven now - every absent listing, plus a
        # 300-entry rotation tail - so there is no cap to tune here. It sizes
        # itself to what discovery found, which is what lets the cycle get
        # shorter as absence falls.
      - run: python scripts/vinted_track.py --mode plan --in found --out queue.json
      - uses: actions/upload-artifact@v4
        with: { name: queue, path: queue.json }
      # Newly discovered listings are state too; losing them would mean
      # rediscovering the whole corpus next cycle.
      - run: python scripts/vinted_merge_state.py
      - name: Persist discoveries
        run: |
          git config user.name  'vinted-tracker[bot]'
          git config user.email 'vinted-tracker@users.noreply.github.com'
          git add data/vinted_track.json
          git diff --cached --quiet || {
            git commit -m "vinted plan: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort || true
            git push origin main; }

  check:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4] }
    env:
      VT_MAX_REQ: '600'
      VT_BUDGET_MIN: '40'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - uses: actions/download-artifact@v4
        with: { name: queue }
      - run: >
          python scripts/vinted_track.py --mode check --queue queue.json
          --shard ${{ matrix.shard }} --shards 5
          --out verdicts-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: verdicts-${{ matrix.shard }}
          path: verdicts-${{ matrix.shard }}.json

  # A shard that drew a bad address is refused after ~100 requests and defers
  # the rest of its slice. This job runs afterwards on its OWN runner, so it
  # draws its own address, and retries exactly the entries no shard returned a
  # verdict for - absent listings first, since that is where the sales are.
  # If it also draws badly it gives up cheaply and nothing is worse than
  # before.
  rescue:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      VT_MAX_REQ: '600'
      VT_BUDGET_MIN: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - uses: actions/download-artifact@v4
        with: { name: queue }
      - uses: actions/download-artifact@v4
        with: { path: verdicts, pattern: 'verdicts-*', merge-multiple: true }
      - run: >
          python scripts/vinted_track.py --mode rescue --queue queue.json
          --in verdicts --out verdicts-rescue.json
      - uses: actions/upload-artifact@v4
        with: { name: verdicts-rescue, path: verdicts-rescue.json }

  apply:
    needs: [check, rescue]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - uses: actions/download-artifact@v4
        with: { path: verdicts, pattern: 'verdicts-*', merge-multiple: true }
      - run: python scripts/vinted_track.py --mode apply --in verdicts
      - run: python scripts/vinted_merge_state.py
      - name: Persist verdicts
        run: |
          git config user.name  'vinted-tracker[bot]'
          git config user.email 'vinted-tracker@users.noreply.github.com'
          git add data/vinted_track.json
          git diff --cached --quiet || {
            git commit -m "vinted track: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort || true
            git push origin main; }
