name: vinted-sustained-probe
on:
  workflow_dispatch:
    inputs:
      gaps: { description: "gaps to walk", default: "2.0,3.0,4.5" }
      n:   { description: 'how many fetches', default: "150" }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - env: { GAPS: "${{ inputs.gaps }}", N: '${{ inputs.n }}' }
        run: python scripts/vinted_sustained_probe.py
