name: proxy-diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Raw proxy response (verbose, shows gateway status)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          echo "--- plain HTTP through proxy ---"
          curl -sv --max-time 30 -x "$PROXY_URL" http://ip-api.com/json 2>&1 | grep -vE '^\* (Trying|Connected|Establish)' | head -30 || true
          echo "--- HTTPS CONNECT through proxy ---"
          curl -sv --max-time 30 -x "$PROXY_URL" https://www.vinted.it/robots.txt 2>&1 | grep -E '^(< |> |\* Proxy|\* CONNECT|curl:)' | head -30 || true
          echo "--- exit code of a plain vinted API call ---"
          curl -s -o /dev/null -w 'api http=%{http_code}\n' --max-time 40 -x "$PROXY_URL" \
            -A 'Mozilla/5.0' 'https://www.vinted.it/api/v2/catalog/items?search_text=prada&per_page=5' || echo "curl exit $?"
