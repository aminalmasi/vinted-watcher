name: vc-brand-ranking

# One-off analysis: rank every brand by sold women's shoes above a price floor,
# using the search API's facets. Read-only, ~12 paced requests.
on:
  workflow_dispatch:

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - run: python scripts/vc_brand_ranking.py
