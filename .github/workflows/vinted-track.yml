name: vinted-track
on:
  # Hourly, not 3-hourly. Sale detection is latency-bound: a listing that sells
  # and is then deleted by the seller 404s before we reach it and is recorded
  # as "deleted" rather than "sold" - and deletions run about 1:1 with
  # confirmed sales. Checking sooner should convert some of that back.
  #
  # One job at the measured-safe rate covers every absent listing in ~22 min at
  # the current corpus size, so this needs no parallelism.
  schedule:
    # Every two hours, not hourly. Scheduled triggers are best-effort and were
    # actually landing 2.5-3h apart, so an hourly cron with a 45-minute budget
    # left most of each window unused while the absent queue went uncovered.
    # A longer budget on a realistic cadence covers the queue instead.
    - cron: '25 */2 * * *'
  workflow_dispatch:
concurrency: { group: vinted-track, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - name: Track
        env:
          # Must finish inside the hourly cadence with room for the commit;
          # anything not reached simply leads the queue next cycle.
          # ~1,330 checks, which clears the ~970 absent queue with room for
          # rotation, and stays under the ~1,800 per-IP ceiling once the ~160
          # discovery requests are counted.
          VT_BUDGET_MIN: '80'
        run: python scripts/vinted_track.py
      - name: Persist
        run: |
          git config user.name  'vinted-tracker[bot]'
          git config user.email 'vinted-tracker@users.noreply.github.com'
          git add data/vinted_track.json
          git diff --cached --quiet || {
            git commit -m "vinted track: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort || true
            git push origin main; }
