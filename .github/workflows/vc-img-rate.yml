name: vc-img-rate
on: { workflow_dispatch: {} }
jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet -r requirements.txt
      - run: python scripts/vc_img_rate.py
