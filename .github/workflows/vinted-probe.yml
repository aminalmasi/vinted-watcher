name: vinted-probe

# One-off: what does the Vinted IT API give us, and how is SOLD encoded?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: Probe Vinted through the Italy proxy
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scripts/probe_sold.py
