name: vinted-probe

# One-off: find a sold-confirmation path that Vinted does not 403.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt
      - name: Probe confirmation paths
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scripts/probe_bootstrap.py
