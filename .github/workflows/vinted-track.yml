name: vinted-track
on:
  # Hourly, not 3-hourly. Sale detection is latency-bound: a listing that sells
  # and is then deleted by the seller 404s before we reach it and is recorded
  # as "deleted" rather than "sold" - and deletions run about 1:1 with
  # confirmed sales. Checking sooner should convert some of that back.
  #
  # One job at the measured-safe rate covers every absent listing in ~22 min at
  # the current corpus size, so this needs no parallelism.
  schedule:
    # Two-hourly. Hourly with a full sweep was tried and hit a 403 during
    # discovery - a full sweep costs ~600 requests, not the ~250 estimated.
    # This cadence with four bands and an 80-minute budget is the combination
    # measured clean (cycle 9: 1,072 checks, 0 throttled).
    - cron: '25 */2 * * *'
  workflow_dispatch:
concurrency: { group: vinted-track, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - name: Track
        env:
          # Must finish inside the hourly cadence with room for the commit;
          # anything not reached simply leads the queue next cycle.
          # Cycle 9 ran this clean: ~1,070 checks against ~490 absences,
          # leaving headroom for rotation.
          VT_BUDGET_MIN: '80'
        run: python scripts/vinted_track.py
      # Merge before committing. Two overlapping cycles each wrote the whole
      # state file and the later one silently dropped nine confirmed sales.
      - name: Merge with remote state
        run: python scripts/vinted_merge_state.py
      - name: Persist
        run: |
          git config user.name  'vinted-tracker[bot]'
          git config user.email 'vinted-tracker@users.noreply.github.com'
          git add data/vinted_track.json
          git diff --cached --quiet || {
            git commit -m "vinted track: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort || true
            git push origin main; }
