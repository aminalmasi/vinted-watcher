name: vinted-sustained-probe
on:
  workflow_dispatch:
    inputs:
      gap: { description: 'seconds between item fetches', default: '1.0' }
      n:   { description: 'how many fetches', default: '400' }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - env: { GAP: '${{ inputs.gap }}', N: '${{ inputs.n }}' }
        run: python scripts/vinted_sustained_probe.py
