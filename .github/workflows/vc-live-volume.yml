name: vc-live-volume
on: { workflow_dispatch: {} }
jobs:
  vol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet -r requirements.txt
      - run: python scripts/vc_live_volume.py
