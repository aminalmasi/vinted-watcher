name: vestiaire-probe3

# Final design probe: sold-hit shape, real counts, createdAt windowing, sold
# pagination depth. Slow pace (6-10 s), aborts on the first 429.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - run: python scripts/probe_vestiaire3.py
