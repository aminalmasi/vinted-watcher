name: vinted-band-probe
on:
  workflow_dispatch:
    inputs:
      pages: { description: 'pages per band', default: '4' }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - env: { PAGES: '${{ inputs.pages }}' }
        run: python scripts/vinted_band_probe.py
