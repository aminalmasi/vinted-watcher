name: watch

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 min (GitHub often fires this 5-20 min late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Do not send Telegram messages'
        type: boolean
        default: false

# Never let two runs race on data/state.json.
concurrency:
  group: vinted-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt

      - name: Poll Vinted and report sold listings
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Persist state
        run: |
          git config user.name  'vinted-watcher[bot]'
          git config user.email 'vinted-watcher@users.noreply.github.com'
          git add data/state.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another run may have landed while we polled.
            git pull --rebase --autostash origin main
            git push origin main
          fi
