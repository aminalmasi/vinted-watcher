name: vinted-track
# Superseded by vinted-track-split.yml, which separates discovery from
# checking so each gets its own request allowance. Kept dispatchable as a
# single-job fallback, but unscheduled: both share the vinted-track
# concurrency group.
on:
  workflow_dispatch:
concurrency: { group: vinted-track, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - name: Track
        env:
          # ~22 min of full sweep plus ~1,100 checks, inside the 120-min
          # timeout with room for the merge and commit.
          VT_BUDGET_MIN: '95'
        run: python scripts/vinted_track.py
      # Merge before committing. Two overlapping cycles each wrote the whole
      # state file and the later one silently dropped nine confirmed sales.
      - name: Merge with remote state
        run: python scripts/vinted_merge_state.py
      - name: Persist
        run: |
          git config user.name  'vinted-tracker[bot]'
          git config user.email 'vinted-tracker@users.noreply.github.com'
          git add data/vinted_track.json
          git diff --cached --quiet || {
            git commit -m "vinted track: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs --autostash origin main || git rebase --abort || true
            git push origin main; }
