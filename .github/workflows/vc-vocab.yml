name: vc-vocab
on:
  workflow_dispatch:
concurrency:
  group: vestiaire-api
  cancel-in-progress: false
jobs:
  vocab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt
      - run: python scripts/vc_vocab.py
